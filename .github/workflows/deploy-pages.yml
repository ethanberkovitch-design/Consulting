name: Deploy apps to GitHub Pages

# One Pages site serves both apps:
#   /Consulting/             → pension-advisor
#   /Consulting/expert-hub/  → expert-hub

on:
  push:
    branches: [main]
    paths:
      - 'pension-advisor/**'
      - 'expert-hub/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pension-advisor/package-lock.json
            expert-hub/package-lock.json
      - name: Build pension-advisor
        working-directory: pension-advisor
        run: |
          npm ci
          npm run build
      - name: Build expert-hub
        working-directory: expert-hub
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r pension-advisor/dist/. site/
          mkdir -p site/expert-hub
          cp -r expert-hub/dist/. site/expert-hub/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
