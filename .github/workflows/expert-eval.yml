name: Expert Hub eval

# Runs one expert's eval cases through the real production path twice and
# grades them with a Claude judge. compare=effort: baseline effort=high vs v1
# effort=medium. compare=calc: both high, baseline without and v1 with the
# code-execution sandbox. Manual only: every run spends API credit.

on:
  workflow_dispatch:
    inputs:
      expert:
        description: Which expert to test
        type: choice
        options: [concrete, management, finance, structural, steel, supply, hr, innovation, geology, drawings, contracts, safety, scheduling, core]
        default: concrete
      compare:
        description: What to compare
        type: choice
        options: [effort, calc]
        default: effort
      limit:
        description: Pilot size - run only the first N cases (0 = all)
        default: '3'
        required: true
      approve_harness:
        description: I reviewed expert-hub/evals/run-eval.mjs and expert-hub-case.mjs and approve running them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: expert-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expert-hub/evals
    env:
      EVAL_EXPERT: ${{ inputs.expert }}
      EVAL_MIXED: ${{ inputs.expert == 'core' && '1' || '' }}
      EVAL_LIMIT: ${{ inputs.limit }}
      EVAL_EMAIL: ${{ secrets.EVAL_EMAIL }}
      EVAL_PASSWORD: ${{ secrets.EVAL_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FLOW: ${{ inputs.expert }}/runs
      APPROVE: ${{ inputs.approve_harness && '--approve-harness' || '' }}
      V1_EFFORT: ${{ inputs.compare == 'calc' && 'high' || 'medium' }}
      BASE_CALC: ${{ inputs.compare == 'calc' && 'off' || '' }}
      V1_CALC: ${{ inputs.compare == 'calc' && 'on' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expert-hub/evals/package-lock.json
      - run: npm ci
      - name: Label the variants
        run: |
          node -e '
            const fs = require("fs"); const p = process.env.FLOW + "/_state.json";
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            s.variant_notes = process.env.V1_CALC
              ? { baseline: "effort=high, no code execution", v1: "effort=high + code execution" }
              : { baseline: "effort=high (production setting)", v1: "effort=medium" };
            fs.writeFileSync(p, JSON.stringify(s, null, 2) + "\n");'
      - name: Baseline
        run: EVAL_EFFORT=high EVAL_CALC=$BASE_CALC node run-eval.mjs --flow "$FLOW" --variant baseline --model claude-opus-5-5 --concurrency 3 --timeout-s 300 $APPROVE
      - name: v1
        # one failed baseline case should not cancel the comparison on the rest
        if: success() || failure()
        run: EVAL_EFFORT=$V1_EFFORT EVAL_CALC=$V1_CALC node run-eval.mjs --flow "$FLOW" --variant v1 --model claude-opus-5-5 --concurrency 3 --timeout-s 300 $APPROVE
      - name: Summary and report
        if: always()
        run: |
          node summarize.mjs "$FLOW" > "$FLOW/summary.md"
          cat "$FLOW/summary.md"
          cat "$FLOW/summary.md" >> "$GITHUB_STEP_SUMMARY"
          node review-page.mjs "$FLOW"
          cat "$FLOW/review.md" >> "$GITHUB_STEP_SUMMARY"
          node build-report-lite.mjs "$FLOW"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ inputs.expert }}-${{ github.run_number }}
          path: expert-hub/evals/${{ inputs.expert }}/runs
          retention-days: 30
