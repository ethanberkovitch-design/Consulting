<title>ברוכים הבאים לעולם הבטון</title>
<meta name="description" content="לומדה דיגיטלית לקליטה ורענון עובדים במפעלי בטון, מחצבות ומוספים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>/* הצבעים נלקחו מהאיורים של החוברת, כדי שהלומדה והאיורים ייראו כמערכת אחת */
:root {
  --navy: #1F3A5F;
  --navy-2: #2B4C77;
  --orange: #E67A2E;
  --yellow: #F0B505;
  --green: #2EA05A;
  --red: #D64545;
  --blue: #2E86C1;
  --sky: #CFE3F6;
  --ink: #1E2A38;
  --muted: #5B6B7D;
  --line: #E3E8EF;
  --bg: #F4F6FA;
  --card: #FFFFFF;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(16, 32, 56, .06), 0 8px 24px rgba(16, 32, 56, .08);
  --accent: var(--orange);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Heebo', 'Assistant', 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
img { max-width: 100%; display: block; }
b, strong { font-weight: 700; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── מבנה ── */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--navy); color: #fff;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}
.topbar-in { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.logo-pill { background: #fff; border-radius: 10px; padding: 4px 8px; display: flex; align-items: center; }
.logo-pill img { height: 28px; width: auto; }
.logo-mark { font-weight: 900; color: var(--navy); white-space: nowrap; padding: 2px 4px; line-height: 1.2; }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-weight: 400; font-size: 12px; opacity: .75; }
.spacer { flex: 1; }
.top-actions { display: flex; gap: 6px; }
.icon-btn {
  background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px;
  padding: 7px 11px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.icon-btn:hover { background: rgba(255,255,255,.22); }
.icon-btn .lbl { display: inline; }
@media (max-width: 640px) { .icon-btn .lbl { display: none; } .brand small { display: none; } }

main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
.footer { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 16px 30px; }
.footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; cursor: pointer;
  background: var(--accent); color: #fff; font-size: 16px; display: inline-flex; align-items: center; gap: 8px;
  transition: transform .08s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.navy { background: var(--navy); }
.btn.green { background: var(--green); }
.btn.ghost { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 2px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 2px var(--navy); }
.btn.big { padding: 15px 28px; font-size: 18px; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* ── מסך כניסה ── */
.hero {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 60%, #35609A 100%);
  color: #fff; border-radius: 24px; padding: 34px 26px 0; overflow: hidden; position: relative;
}
.hero .kicker { display: inline-block; background: var(--yellow); color: var(--navy); font-weight: 800; border-radius: 99px; padding: 3px 12px; font-size: 13px; }
.hero h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 900; margin: 12px 0 8px; letter-spacing: -.5px; }
.hero p { margin: 0 0 18px; opacity: .9; max-width: 640px; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.hero .chip { background: rgba(255,255,255,.14); border-radius: 99px; padding: 4px 12px; font-size: 14px; }
.hero-img { background: #fff; border-radius: 16px 16px 0 0; padding: 10px 14px 0; margin: 0 -6px; }
.login-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; margin-top: 20px; }
@media (max-width: 820px) { .login-grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-weight: 700; font-size: 15px; }
.field .hint { font-size: 13px; color: var(--muted); }
.field input, .field select {
  border: 2px solid var(--line); border-radius: 12px; padding: 11px 13px; background: #fff; color: var(--ink);
}
.field input:focus, .field select:focus { border-color: var(--blue); outline: none; }
.mode-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-pick label {
  border: 2px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; display: block; font-weight: 400;
}
.mode-pick input { position: absolute; opacity: 0; }
.mode-pick .t { font-weight: 800; display: block; }
.mode-pick .d { font-size: 13px; color: var(--muted); }
.mode-pick input:checked + span { color: var(--navy); }
.mode-pick label:has(input:checked) { border-color: var(--orange); background: #FFF6EF; }
.err { color: var(--red); font-size: 14px; font-weight: 700; min-height: 1.4em; }
.how-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.how-list li { display: flex; gap: 12px; align-items: flex-start; }
.how-list .n { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--sky); color: var(--navy); font-weight: 800; display: grid; place-items: center; }

/* ── לוח מסלול ── */
.dash-head { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; margin-bottom: 22px; }
@media (max-width: 640px) { .dash-head { grid-template-columns: 1fr; text-align: center; justify-items: center; } }
.ring { width: 128px; height: 128px; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 900; font-size: 28px; color: var(--navy); line-height: 1.1; }
.ring .val small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.dash-head h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 900; color: var(--navy); }
.dash-head p { margin: 4px 0 0; color: var(--muted); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag { background: var(--sky); color: var(--navy); border-radius: 99px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
.tag.orange { background: #FDE6D4; color: #A34D12; }
.section-title { font-size: 20px; font-weight: 800; color: var(--navy); margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
.section-title .line { flex: 1; height: 2px; background: var(--line); }
.chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.chap {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; border: 0; padding: 0; text-align: right; color: inherit;
  transition: transform .15s ease, box-shadow .15s ease; position: relative;
}
.chap:hover:not(.locked) { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(16,32,56,.14); }
.chap .thumb {
  height: 104px; position: relative; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 20% 120%, rgba(255,255,255,.28) 0 38%, transparent 39%),
              radial-gradient(circle at 90% -10%, rgba(255,255,255,.18) 0 30%, transparent 31%), var(--c);
}
.chap .ico { width: 64px; height: 64px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 34px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.chap .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.chap .num { position: absolute; top: 10px; right: 12px; font-size: 40px; font-weight: 900; color: rgba(255,255,255,.85); line-height: 1; }
.chap h3 { font-size: 18px; font-weight: 800; }
.chap .sub { font-size: 14px; color: var(--muted); }
.chap .meta { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.status { font-weight: 800; border-radius: 99px; padding: 2px 10px; font-size: 13px; }
.status.done { background: #DDF3E5; color: #1D6E3D; }
.status.open { background: #FDE6D4; color: #A34D12; }
.status.lock { background: #EEF1F5; color: #7A8796; }
.status.fail { background: #FBE1E1; color: #A12C2C; }
.chap.locked { cursor: not-allowed; }
.chap.locked .thumb, .chap.locked .body { filter: grayscale(1); opacity: .55; }
.chap.next { outline: 3px solid var(--orange); outline-offset: 0; }
.banner { border-radius: var(--radius); padding: 18px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.banner.win { background: linear-gradient(135deg, #2EA05A, #1E7F45); color: #fff; }
.banner .t { font-weight: 900; font-size: 20px; }
.banner .grow { flex: 1; min-width: 200px; }

/* ── נגן פרק ── */
.player-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.player-head .badge { flex: 0 0 52px; height: 52px; border-radius: 16px; background: var(--c); color: #fff; font-weight: 900; font-size: 24px; display: grid; place-items: center; }
.player-head h1 { font-size: clamp(20px, 3.4vw, 28px); font-weight: 900; color: var(--navy); }
.player-head .sub { color: var(--muted); font-size: 15px; }
.progress { height: 8px; background: #E3E8EF; border-radius: 99px; overflow: hidden; margin: 6px 0 18px; }
.progress > i { display: block; height: 100%; background: var(--c, var(--orange)); border-radius: 99px; transition: width .35s ease; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: #D5DCE5; }
.dots span.on { background: var(--c); }
.dots span.cur { background: var(--c); transform: scale(1.35); box-shadow: 0 0 0 3px rgba(0,0,0,.06); }
.screen { animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.screen h2 { font-size: clamp(20px, 3vw, 26px); font-weight: 800; color: var(--navy); margin-bottom: 14px; }
.screen p { margin: 0 0 14px; }
.screen h3 { font-size: 19px; font-weight: 800; color: var(--navy); margin: 18px 0 8px; }
.nav-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

.fig { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 6px 0 16px; }
.fig img { margin: 0 auto; }
.fig figcaption, .caption { text-align: center; font-size: 14px; color: var(--muted); margin-top: 8px; }
.fig2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .fig2 { grid-template-columns: 1fr; } }
.fig2 .fig { margin: 0 0 16px; }

.callout { border-radius: 14px; padding: 14px 16px 14px 16px; margin: 6px 0 16px; display: flex; gap: 12px; align-items: flex-start; }
.callout .ic { flex: 0 0 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 900; }
.callout .tt { font-weight: 800; display: block; margin-bottom: 2px; }
.callout.tip { background: #FFF8E1; border-inline-start: 5px solid var(--yellow); }
.callout.tip .ic { background: var(--yellow); color: var(--navy); }
.callout.warn { background: #FFEFE5; border-inline-start: 5px solid var(--orange); }
.callout.warn .ic { background: var(--orange); color: #fff; }
.callout.demo { background: #EAF3FC; border-inline-start: 5px solid var(--blue); }
.callout.demo .ic { background: var(--blue); color: #fff; }

.dodont { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 16px; }
@media (max-width: 680px) { .dodont { grid-template-columns: 1fr; } }
.dd { border-radius: 14px; padding: 14px 16px; }
.dd h4 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.dd h4 .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px; }
.dd ul { margin: 0; padding: 0 18px 0 0; }
.dd li { margin-bottom: 5px; }
.dd.do { background: #E8F6EE; } .dd.do h4 { color: #1D6E3D; } .dd.do .ic { background: var(--green); }
.dd.dont { background: #FCEAEA; } .dd.dont h4 { color: #A12C2C; } .dd.dont .ic { background: var(--red); }

.steps { list-style: none; padding: 0; margin: 6px 0 16px; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: flex; gap: 12px; background: #F7F9FC; border-radius: 14px; padding: 12px 14px; align-items: flex-start; }
.steps li::before { content: counter(s); flex: 0 0 32px; height: 32px; border-radius: 50%; background: var(--c, var(--orange)); color: #fff; font-weight: 900; display: grid; place-items: center; }
.steps .st { font-weight: 800; display: block; color: var(--navy); }

.blist { padding: 0; margin: 4px 0 16px; list-style: none; display: grid; gap: 8px; }
.blist li { position: relative; padding-right: 22px; }
.blist li::before { content: ''; position: absolute; right: 2px; top: .62em; width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--orange)); }

.tbl-wrap { overflow-x: auto; margin: 6px 0 16px; border-radius: 14px; border: 1px solid var(--line); }
table.t { width: 100%; border-collapse: collapse; font-size: 15px; background: #fff; }
table.t th { background: var(--navy); color: #fff; text-align: right; padding: 10px 12px; font-weight: 700; white-space: nowrap; }
table.t td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
table.t tr:nth-child(even) td { background: #F9FAFC; }
table.t td:first-child { font-weight: 700; color: var(--navy); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 6px 0 16px; }
.icard { border-radius: 16px; padding: 16px; background: #fff; border: 2px solid var(--line); border-top: 6px solid var(--cc); }
.icard .k { font-size: 13px; font-weight: 800; color: var(--cc); }
.icard h4 { margin: 0 0 6px; font-size: 19px; color: var(--navy); }
.icard p { margin: 0; font-size: 15px; color: #33465A; }

.legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 16px; }
@media (max-width: 640px) { .legend { grid-template-columns: 1fr 1fr; } }
.legend div { background: #F7F9FC; border-radius: 14px; padding: 12px; text-align: center; font-size: 14px; }
.legend .ic { width: 38px; height: 38px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 18px; }
.legend b { display: block; }

.sizes { display: grid; gap: 10px; margin: 6px 0 8px; }
.size-row { display: grid; grid-template-columns: 160px 1fr 90px; gap: 12px; align-items: center; background: #F7F9FC; border-radius: 12px; padding: 10px 14px; }
@media (max-width: 560px) { .size-row { grid-template-columns: 1fr 70px; } .size-row .stones { display: none; } }
.size-row .nm { font-weight: 800; color: var(--navy); }
.size-row .mm { font-weight: 700; color: var(--muted); direction: ltr; text-align: left; font-size: 14px; }
.stones { display: flex; gap: 4px; align-items: center; }
.stones i { display: block; border-radius: 40% 50% 45% 55%; background: #B98E5E; }

.chat { display: grid; gap: 10px; margin: 6px 0 16px; }
.bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; }
.bubble .who { font-size: 12px; font-weight: 800; display: block; opacity: .7; }
.bubble.cust { background: #FCEAEA; justify-self: start; border-bottom-right-radius: 4px; }
.bubble.emp { background: #E8F6EE; justify-self: end; border-bottom-left-radius: 4px; }

.lab { background: #0F2440; color: #fff; border-radius: 16px; padding: 18px; margin: 6px 0 16px; }
.lab .lt { font-weight: 800; color: var(--yellow); font-size: 14px; letter-spacing: .3px; }
.lab h4 { margin: 2px 0 12px; font-size: 18px; }
.lab input[type=range] { width: 100%; accent-color: var(--yellow); }
.lab .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
@media (max-width: 640px) { .lab .row { grid-template-columns: 1fr; } }
.lab .big { font-size: 34px; font-weight: 900; direction: ltr; text-align: right; }
.lab .meter { height: 14px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
.lab .meter i { display: block; height: 100%; border-radius: 99px; transition: width .2s ease, background .2s ease; }
.lab .verdict { border-radius: 12px; padding: 10px 12px; font-weight: 800; margin-top: 10px; }
.lab .note { font-size: 13px; opacity: .7; margin-top: 8px; }
.lab .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lab .inputs label { font-size: 14px; display: grid; gap: 4px; }
.lab .inputs input { border: 0; border-radius: 10px; padding: 10px; font-weight: 700; direction: ltr; text-align: right; }
.cube { width: 100%; max-width: 220px; aspect-ratio: 1; background: #A9B3BE; border-radius: 10px; position: relative; overflow: hidden; margin: 0 auto; box-shadow: inset 0 0 0 4px #8C97A3; }
.cube i { position: absolute; border-radius: 50%; background: #3A4654; }

.remember { background: linear-gradient(135deg, #FFF8E1, #FFEFD9); border: 2px solid #F5D78A; border-radius: 20px; padding: 22px; }
.remember h2 { display: flex; align-items: center; gap: 10px; }
.remember ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.remember li { background: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 700; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.remember li::before { content: '✔'; color: #fff; background: var(--green); width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; margin-top: 1px; }

.intro-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.intro-meta .m { background: #F1F4F8; border-radius: 10px; padding: 6px 12px; font-size: 14px; }
.intro-meta .m b { color: var(--navy); }
.goals { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 8px; }
.goals li { display: flex; gap: 10px; align-items: center; }
.goals li::before { content: '🎯'; }

/* ── מבחן ── */
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.qcount { font-weight: 800; color: var(--navy); }
.crit { background: #FBE1E1; color: #A12C2C; font-weight: 800; font-size: 13px; border-radius: 99px; padding: 3px 12px; }
.qtext { font-size: clamp(19px, 2.6vw, 23px); font-weight: 800; color: var(--navy); margin: 6px 0 16px; line-height: 1.4; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: right; width: 100%;
  background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px; cursor: pointer; color: var(--ink);
  transition: border-color .12s ease, background .12s ease;
}
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt .l { flex: 0 0 32px; height: 32px; border-radius: 10px; background: #EEF1F5; display: grid; place-items: center; font-weight: 900; color: var(--navy); }
.opt.sel { border-color: var(--blue); background: #EAF3FC; }
.opt.sel .l { background: var(--blue); color: #fff; }
.opt.right { border-color: var(--green); background: #E8F6EE; }
.opt.right .l { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: #FCEAEA; }
.opt.wrong .l { background: var(--red); color: #fff; }
.opt:disabled { cursor: default; }
.feedback { margin-top: 14px; border-radius: 14px; padding: 14px 16px; animation: rise .25s ease; }
.feedback.ok { background: #E8F6EE; border-inline-start: 5px solid var(--green); }
.feedback.no { background: #FCEAEA; border-inline-start: 5px solid var(--red); }
.feedback .h { font-weight: 900; display: block; margin-bottom: 2px; }

.result { text-align: center; }
.result .emoji { font-size: 64px; line-height: 1; }
.result h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 900; margin: 10px 0 4px; }
.result .score { font-size: 56px; font-weight: 900; color: var(--navy); }
.result .why { color: var(--muted); }
.review { text-align: right; margin-top: 20px; display: grid; gap: 10px; }
.review .ri { background: #FCEAEA; border-radius: 12px; padding: 12px 14px; }
.review .ri b { color: #A12C2C; }

/* ── מודאל ── */
.modal-bg { position: fixed; inset: 0; background: rgba(15, 30, 50, .55); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { background: #fff; border-radius: 20px; max-width: 760px; width: 100%; max-height: 88vh; overflow: auto; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.modal-head h2 { color: var(--navy); font-size: 22px; font-weight: 900; }
.x { border: 0; background: #EEF1F5; border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 18px; }
.gloss-search { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.flip { perspective: 800px; height: 120px; cursor: pointer; border: 0; background: none; padding: 0; }
.flip .in { position: relative; width: 100%; height: 100%; transition: transform .45s ease; transform-style: preserve-3d; }
.flip.on .in { transform: rotateY(180deg); }
.flip .f, .flip .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; display: grid; place-items: center; padding: 12px; text-align: center; }
.flip .f { background: var(--navy); color: #fff; font-weight: 900; font-size: 19px; }
.flip .b { background: #FFF8E1; color: var(--ink); transform: rotateY(180deg); font-size: 15px; border: 2px solid #F5D78A; }
.rules { list-style: none; padding: 0; margin: 0; counter-reset: r; display: grid; gap: 8px; }
.rules li { counter-increment: r; display: flex; gap: 12px; align-items: center; background: #F7F9FC; border-radius: 12px; padding: 10px 12px; font-weight: 700; }
.rules li::before { content: counter(r); flex: 0 0 34px; height: 34px; border-radius: 10px; background: var(--yellow); color: var(--navy); font-weight: 900; display: grid; place-items: center; }

/* ── גרסת בחינה ── */
.review-bar { background: var(--yellow); color: var(--navy); text-align: center; font-weight: 700; font-size: 14px; padding: 6px 16px; }
.key-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.key-tab { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--c); background: #fff; color: var(--c); font-weight: 900; cursor: pointer; }
.key-tab.on { background: var(--c); color: #fff; }
.key-q { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.kq { font-weight: 800; color: var(--navy); margin-bottom: 6px; }
.key-opts { margin: 0 0 6px; padding-right: 22px; list-style-type: hebrew; }
.key-opts li { padding: 1px 4px; border-radius: 6px; }
.key-opts li.ok { background: #DDF3E5; color: #1D6E3D; font-weight: 700; }
.ke { font-size: 14px; color: var(--muted); }

/* ── תעודה ── */
.cert {
  background: #fff; border-radius: 10px; padding: 36px 34px; position: relative;
  border: 10px solid var(--navy); box-shadow: inset 0 0 0 3px var(--yellow), var(--shadow);
}
.cert .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cert .top img { height: 44px; width: auto; }
.cert .seal { width: 86px; height: 86px; border-radius: 50%; background: var(--orange); color: #fff; display: grid; place-items: center; text-align: center; font-weight: 900; font-size: 13px; line-height: 1.2; box-shadow: 0 0 0 5px #FDE6D4; }
.cert h1 { text-align: center; color: var(--navy); font-size: clamp(26px, 4vw, 38px); font-weight: 900; margin: 18px 0 4px; }
.cert .who { text-align: center; font-size: 26px; font-weight: 900; margin: 12px 0 2px; }
.cert .sub { text-align: center; color: var(--muted); }
.cert .decl { background: #F7F9FC; border-radius: 12px; padding: 12px 14px; margin: 16px 0; font-size: 15px; }
.sign-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 28px; }
.sign-row div { border-top: 2px solid var(--ink); padding-top: 6px; font-size: 14px; text-align: center; }
@media (max-width: 640px) { .sign-row { grid-template-columns: 1fr; } .cert { padding: 22px 16px; } }

/* ── מנהל ── */
.mgr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: #fff; border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.stat .v { font-size: 30px; font-weight: 900; color: var(--navy); }
.stat .k { color: var(--muted); font-size: 14px; }
.mgr-tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.mgr-tools input, .mgr-tools select { border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; background: #fff; }
.mgr-tools input { flex: 1; min-width: 180px; }
table.t tr.clickable { cursor: pointer; }
table.t tr.clickable:hover td { background: #EEF4FB; }
.mini-bar { width: 90px; height: 8px; background: #E3E8EF; border-radius: 99px; overflow: hidden; display: inline-block; vertical-align: middle; margin-inline-start: 6px; }
.mini-bar i { display: block; height: 100%; background: var(--green); }
.detail td { background: #FAFBFD !important; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.cchip { border-radius: 8px; padding: 3px 8px; font-size: 13px; font-weight: 700; }
.cchip.ok { background: #DDF3E5; color: #1D6E3D; }
.cchip.no { background: #FBE1E1; color: #A12C2C; }
.cchip.none { background: #EEF1F5; color: #7A8796; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 12px; z-index: 60; font-size: 15px; box-shadow: var(--shadow); animation: rise .25s ease; }
.sync-note { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sync-note i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
.sync-note.pending i { background: var(--yellow); }
.sync-note.local i { background: #A0AAB6; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: drop linear forwards; }
@keyframes drop { to { transform: translateY(105vh) rotate(720deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media print {
  body { background: #fff; }
  .topbar, .footer, .no-print, .toast { display: none !important; }
  main { padding: 0; max-width: none; }
  .cert { box-shadow: none; }
}
